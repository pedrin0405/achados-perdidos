services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados_banco:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rede_interna
    restart: unless-stopped

  web:
    build: ./app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:5000"
    healthcheck:
      # python:3.12-slim nao tem curl: usamos urllib do proprio python
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=5)']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - fotos:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_interna
    restart: unless-stopped

volumes:
  dados_banco:
  fotos:

networks:
  rede_interna:
    driver: bridge